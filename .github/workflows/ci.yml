name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (testes e migrações)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fabri
          POSTGRES_PASSWORD: fabri
          POSTGRES_DB: fabricontrol_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fabri -d fabricontrol_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TZ: America/Sao_Paulo
      TEST_DATABASE_URL: postgresql+psycopg://fabri:fabri@localhost:5432/fabricontrol_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Testes
        run: python -m pytest
      - name: Migrações descem e sobem sem diferença para os models
        env:
          DATABASE_URL: ${{ env.TEST_DATABASE_URL }}
        run: |
          alembic downgrade base
          alembic upgrade head
          alembic check

  web:
    name: Web (tipos e build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tipos
        run: npx tsc --noEmit
      - name: Build de produção
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8040
        run: npm run build
